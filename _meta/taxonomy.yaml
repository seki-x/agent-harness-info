schema_version: 2
status: initialized
generated_at: "2026-09-07"

principles:
  primary_organization: problem-domain
  avoid_primary_organization_by:
    - vendor
    - framework
    - product
  hierarchy:
    preserve_semantic_parent_child_relationships: true
    avoid_unnecessary_flattening: true
    avoid_unnecessary_depth: true
    preferred_max_navigation_depth: 3
    avoid_unjustified_single_child_groups: true
  page_boundaries:
    standalone_page_when:
      - independently useful and referenceable
      - requires substantial explanation
      - has its own meaningful design space or trade-offs
      - likely to evolve independently
      - meaningfully referenced from multiple concepts
    keep_as_section_when:
      - mainly a component, subtype, approach, or detail of its parent
      - separation would create a thin page
      - independent treatment adds little explanatory value

structure:
  purpose: primary-navigation-tree
  recursive_children_field: children
  page_nodes_are_leaves: true
  records_intra_page_headings: false
  records_cross_links: false
  node_schema:
    required_fields:
      - id
      - title
      - kind
    allowed_kinds:
      domain: top-level durable problem domain
      group: navigation container, subdomain, or substantive parent concept with child nodes
      page: standalone leaf canonical knowledge page
    optional_fields:
      - description
      - children
  materialization:
    domain_and_group: directory with index.md when the node needs a navigable overview or substantive parent-concept page
    page: Markdown file representing a standalone leaf concept
    subordinate_concept: H2 or H3 in its parent page, not a taxonomy node
    cross_cutting_relationship: related link, not a duplicate node

domains:
  - id: execution
    title: Execution and control
    kind: domain
    description: Task execution, transitions, recovery and allocation of work.
    children:
      - id: control-flow
        title: Control flow
        kind: page
      - id: durable-execution
        title: Durable execution
        kind: page
      - id: multi-agent-coordination
        title: Multi-agent coordination
        kind: page
  - id: context
    title: Context and memory
    kind: domain
    description: Model-visible information and knowledge retained or authored for
      reuse.
    children:
      - id: retrieval-grounding
        title: Retrieval and grounding
        kind: page
      - id: persistent-memory
        title: Persistent memory
        kind: page
      - id: reusable-procedures
        title: Reusable procedures
        kind: page
  - id: action
    title: Action and integration
    kind: domain
    description: Contracts and boundaries for effects and external capabilities.
    children:
      - id: interoperability
        title: Interoperability
        kind: page
  - id: security
    title: Security and human control
    kind: domain
    description: Trust boundaries, enforced authority and user decisions.
    children:
      - id: isolation-authorization
        title: Isolation and authorization
        kind: page
      - id: human-oversight
        title: Human oversight
        kind: page
  - id: assurance
    title: Evaluation and operations
    kind: domain
    description: Evidence of correctness and the operation of bounded systems.
    children:
      - id: evaluation-design
        title: Evaluation design
        kind: page
      - id: observability
        title: Observability
        kind: page
      - id: resource-budgets
        title: Resource budgets
        kind: page
