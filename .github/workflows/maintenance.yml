name: Monthly Maintenance Helper

# The primary executor is a local Codex scheduled task that reads:
# prompts/monthly-maintenance.md
#
# Recommended cadence: first day of each month, 10:00 Asia/Tokyo.
# This workflow intentionally does not invoke the OpenAI API.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  show-runbook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Publish maintenance runbook to job summary
        shell: bash
        run: |
          {
            echo "# Monthly Knowledge Maintenance"
            echo
            echo "Primary executor: Codex scheduled task"
            echo
            echo "Read and execute prompts/monthly-maintenance.md."
            echo
            cat prompts/monthly-maintenance.md
          } >> "$GITHUB_STEP_SUMMARY"
